[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recipe-ingestion"
version = "0.1.0"
description = "Experimental CLI/library to extract structured recipes from recipe website URLs or pasted recipe text using a locally-run Gemma model via Ollama."
requires-python = ">=3.10"
dependencies = [
  "recipe-scrapers>=15.0.0",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "pydantic>=2.7.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
recipe-ingest = "recipe_ingestion.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["recipe_ingestion"]
